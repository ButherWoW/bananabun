services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: affiliate
      POSTGRES_USER: affiliate
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run platform/setup-local.mjs first}
    ports:
      - '127.0.0.1:${LOCAL_DB_PORT:-54329}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U affiliate -d affiliate']
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build: ./backend
    ports:
      - '127.0.0.1:${BACKEND_PORT:-4000}:4000'
    environment:
      DATABASE_URL: postgresql://affiliate:${DB_PASSWORD:?Run platform/setup-local.mjs first}@postgres:5432/affiliate
      JWT_SECRET: ${JWT_SECRET:?Run platform/setup-local.mjs first}
      HOST: 0.0.0.0
      PORT: 4000
      UPLOADS_DIR: /app/uploads
      PUBLIC_URL: http://127.0.0.1:${FRONTEND_PORT:-3000}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
    command: ['sh', '-c', 'npm run db:migrate && npm start']
  frontend:
    build: ./frontend
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-3000}:3000'
    environment:
      VITE_API_URL: ''
      BACKEND_URL: http://backend:4000
    depends_on:
      - backend
    command: ['npm', 'run', 'dev', '--', '--host', '0.0.0.0']
volumes:
  pgdata:
  uploads:
