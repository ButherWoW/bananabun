# Included into the nespizdili.lol server block by the deploy workflow.
# "/" shows a stub page; the Bananabun panel lives under /banana/. /api, /uploads and other paths keep their own rules.
# Pages behind a PIN (the panels and the demos) answer 404 without a pass cookie: the PIN typed on the stub is checked
# by the backend (platform/backend/src/api/routes/gate.js), which sets the pass; auth_request asks it on every request.
location = /_gate/unlock {
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:4000/gate/unlock;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 1k;
}
location ^~ /_gate/check/ {
    internal;
    proxy_pass http://127.0.0.1:4000/gate/check/;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
}
location @gate_closed { return 404; }
# The site's old catch-all (location / with try_files … /index.html) served the panel shell on any path (/login,
# /assets/…). Everything that is not the stub, the panels, /api, /uploads or certificate checks is now a 404.
location ~ ^/(?!(?:api|uploads|banana|umbrella|\.well-known)(?:/|$)) { return 404; }
location = / {
    root /opt/affiliate/frontend/stub;
    try_files /index.html =404;
    add_header Cache-Control "no-store";
}
# Stub page assets (background images): only files from the stub folder, cached for a week.
location ^~ /_stub/ {
    alias /opt/affiliate/frontend/stub/;
    add_header Cache-Control "public, max-age=604800";
}
# Where a wrong PIN on the stub leads.
location = /wrong-pin {
    root /opt/affiliate/frontend/stub;
    try_files /wrong-pin.html =404;
    add_header Cache-Control "no-store";
}
location = /banana { return 404; }
# Public demo: a separate static build (dist-demo) whose API is answered in the browser — it never calls /api.
# The longer ^~ prefix wins over /banana/ below, so /banana/demo/… is never served by the real panel.
location = /banana/demo { return 404; }
location ^~ /banana/demo/ {
    auth_request /_gate/check/bd;
    error_page 401 403 = @gate_closed;
    alias /opt/affiliate/frontend/dist-demo/;
    index index.html;
    error_page 404 = /banana/demo/index.html;
}
location = /banana/demo/index.html {
    auth_request /_gate/check/bd;
    error_page 401 403 = @gate_closed;
    alias /opt/affiliate/frontend/dist-demo/index.html;
    add_header Cache-Control "no-store";
}
# Keitaro conversion postbacks carry the team's secret in the path: never written to the access log.
# The longer ^~ prefixes win over /api/ (main site config) and /banana/api/ below.
location ^~ /api/telegram/keitaro-postback/ {
    access_log off;
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16k;
}
location ^~ /banana/api/telegram/keitaro-postback/ {
    access_log off;
    rewrite ^/banana(/api/.*)$ $1 break;
    proxy_pass http://127.0.0.1:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 16k;
}
# /banana/api/… and /banana/uploads/… are internal rewrites to the existing /api/ and /uploads/ rules (same proxy, headers, limits).
# The old root /api and /uploads stay: published landings, the Mac agent until restart and the TikTok OAuth callback use them.
location ^~ /banana/api/ { rewrite ^/banana(/api/.*)$ $1 last; }
location ^~ /banana/uploads/ { rewrite ^/banana(/uploads/.*)$ $1 last; }
location ^~ /banana/ {
    auth_request /_gate/check/bl;
    error_page 401 403 = @gate_closed;
    alias /opt/affiliate/frontend/dist/;
    index index.html;
    error_page 404 = /banana/index.html;
}
location = /banana/index.html {
    auth_request /_gate/check/bl;
    error_page 401 403 = @gate_closed;
    alias /opt/affiliate/frontend/dist/index.html;
    add_header Cache-Control "no-store";
}
