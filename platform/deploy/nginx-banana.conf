# Included into the nespizdili.lol server block by the deploy workflow.
# "/" shows a stub page; the Bananabun panel lives under /banana/. /api, /uploads and other paths keep their own rules.
location = / {
    root /opt/affiliate/frontend/stub;
    try_files /index.html =404;
    add_header Cache-Control "no-store";
}
# Stub page assets (background images): only files from the stub folder, cached for a week.
location ^~ /_stub/ {
    alias /opt/affiliate/frontend/stub/;
    add_header Cache-Control "public, max-age=604800";
}
# Where a wrong PIN on the stub leads.
location = /wrong-pin {
    root /opt/affiliate/frontend/stub;
    try_files /wrong-pin.html =404;
    add_header Cache-Control "no-store";
}
location = /banana { return 301 /banana/; }
# Public demo: a separate static build (dist-demo) whose API is answered in the browser — it never calls /api.
# The longer ^~ prefix wins over /banana/ below, so /banana/demo/… is never served by the real panel.
location = /banana/demo { return 301 /banana/demo/; }
location ^~ /banana/demo/ {
    alias /opt/affiliate/frontend/dist-demo/;
    index index.html;
    error_page 404 = /banana/demo/index.html;
}
location = /banana/demo/index.html {
    alias /opt/affiliate/frontend/dist-demo/index.html;
    add_header Cache-Control "no-store";
}
# /banana/api/… and /banana/uploads/… are internal rewrites to the existing /api/ and /uploads/ rules (same proxy, headers, limits).
# The old root /api and /uploads stay: published landings, the Mac agent until restart and the TikTok OAuth callback use them.
location ^~ /banana/api/ { rewrite ^/banana(/api/.*)$ $1 last; }
location ^~ /banana/uploads/ { rewrite ^/banana(/uploads/.*)$ $1 last; }
location ^~ /banana/ {
    alias /opt/affiliate/frontend/dist/;
    index index.html;
    error_page 404 = /banana/index.html;
}
location = /banana/index.html {
    alias /opt/affiliate/frontend/dist/index.html;
    add_header Cache-Control "no-store";
}
